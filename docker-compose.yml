services:
  migrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - packages/db/.env
  seeder:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - packages/db/.env
    command: sh -lc "bunx prisma generate --schema=node_modules/@trycompai/db/dist/schema.prisma && bun packages/db/prisma/seed/seed.js"
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    ports:
      - '3000:3000'
    env_file:
      - apps/app/.env
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    command: sh -lc "node apps/app/server.js"

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: portal
      args:
        NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL_PORTAL}
    ports:
      - '3002:3000'
    env_file:
      - apps/portal/.env
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3002/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15
    container_name: comp_db
    environment:
      POSTGRES_DB: comp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./packages/db/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  trigger:
    image: triggerdev/trigger.dev:latest
    container_name: comp_trigger
    environment:
      TRIGGER_PROJECT_ID: your_trigger_project_id
    volumes:
      - ./apps/app/trigger.config.ts:/app/trigger.config.ts
    ports:
      - "8090:8090"

  kv:
    image: upstash/upstash-redis:latest
    container_name: comp_kv
    environment:
      UPSTASH_REDIS_URL: your_redis_url
      UPSTASH_REDIS_TOKEN: your_redis_token
    ports:
      - "6379:6379"

  ui:
    build: ./packages/ui
    container_name: comp_ui
    volumes:
      - ./packages/ui:/app
    ports:
      - "4200:4200"